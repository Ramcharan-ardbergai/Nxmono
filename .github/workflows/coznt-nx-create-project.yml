name: Coznt - create Nx project
on:
  workflow_dispatch:
    inputs:
      project_name: { required: true, type: string }
      template: { required: true, type: string }
      branch: { required: true, type: string }
      coznt_project_id: { required: true, type: string }
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install workspace dependencies
        shell: bash
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then yarn install --immutable
          elif [[ -f package-lock.json ]]; then npm ci
          else echo 'A supported lockfile is required.' >&2; exit 2
          fi
      - name: Select branch
        env: { BRANCH: "${{ inputs.branch }}" }
        run: |
          if git fetch origin "$BRANCH"; then git switch --track "origin/$BRANCH"
          else git switch -c "$BRANCH"
          fi
      - name: Generate application with Nx
        env:
          NAME: "${{ inputs.project_name }}"
          TEMPLATE: "${{ inputs.template }}"
          NX_IGNORE_UNSUPPORTED_TS_SETUP: "true"
        shell: bash
        run: |
          case "$TEMPLATE" in
            angular) PLUGIN='@nx/angular'; GENERATOR='@nx/angular:application' ;;
            react) PLUGIN='@nx/react'; GENERATOR='@nx/react:application' ;;
            next) PLUGIN='@nx/next'; GENERATOR='@nx/next:application' ;;
            node) PLUGIN='@nx/node'; GENERATOR='@nx/node:application' ;;
            nest) PLUGIN='@nx/nest'; GENERATOR='@nx/nest:application' ;;
            express) PLUGIN='@nx/express'; GENERATOR='@nx/express:application' ;;
            vue) PLUGIN='@nx/vue'; GENERATOR='@nx/vue:application' ;;
            nuxt) PLUGIN='@nx/nuxt'; GENERATOR='@nx/nuxt:application' ;;
            react-native) PLUGIN='@nx/react-native'; GENERATOR='@nx/react-native:application' ;;
            expo) PLUGIN='@nx/expo'; GENERATOR='@nx/expo:application' ;;
            *) echo "Unsupported template: $TEMPLATE" >&2; exit 2 ;;
          esac
          node -e "require.resolve('$PLUGIN/package.json')" >/dev/null 2>&1 || npx nx add "$PLUGIN" --no-interactive
          npx nx generate "$GENERATOR" "apps/$NAME" --no-interactive
      - name: Commit and push
        env:
          BRANCH: "${{ inputs.branch }}"
          NAME: "${{ inputs.project_name }}"
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "feat: scaffold $NAME with Nx"
          git push --set-upstream origin "$BRANCH"
      - name: Open pull request
        env:
          GH_TOKEN: "${{ github.token }}"
          BRANCH: "${{ inputs.branch }}"
          NAME: "${{ inputs.project_name }}"
        run: |
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "feat: scaffold $NAME with Nx" --body "Generated by Coznt in GitHub Actions."
